[project]
name = "fraudlens-ai"
version = "0.1.0"
description = "FraudLens AI educational AML prototype"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.5.4,<3",
    "pydantic>=2,<3",
    "scikit-learn>=1.9.1,<2",
    "scipy>=1.18.1,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "jsonschema[format]>=4.23,<5",
]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
